<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
</head>
<body>
    <main>
        <form action="">
            <div class="quiz-item">
                <label for="question1">1. What does the acronym CSS stands for?</label>
                <input type="text" name="question1" id="question1">
            </div>
            <div class="quiz-item">
                <label for="question2">2. How are id and class attribute selected in CSS?</label>
                <input type="text" name="question2" id="question2">
            </div>
            <div class="quiz-item">
                <label for="question3">3. Whic of the following is a valid CSS comment?</label>
                <input type="text" name="question3" id="question3">
                <select name="question3" id="question3">
                    <option value="a"><!-- This is a comment --></option>
                    <option value="b">/* This is a comment */</option>
                    <option value="c">// This is a comment</option>
                </select>
            </div>
            <div class="quiz-item">
                <div class="quiz-item">
                <label for="question4">4. What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px</code>
                <input type="text" name="question4" id="question4">
            </div>
            </div>
        </form>
    </main>
</body>
</html>
