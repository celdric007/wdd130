<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Whitewater rafting Company is a rafting company that organizes trips and typically offers experienced guides to take passengers down a river.">
    <meta name="author" content="Yole Celdric Ijomoni">
    <title>Contact Us | Whitewater Rafting Company</title>
    <link rel="stylesheet" href="/wdd130/wwr/styles/rafting.css">
</head>

<body>
    <header>
        <img src="/wdd130/wwr/images/z-raftingcompas.jpg" alt="">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <section class="form">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31771.057518137342!2d5.756963809570292!3d5.510148861201158!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1791058885663!5m2!1sen!2sng"
                    width="400" height="350" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="fill-form">
                <form action="">
                    <div class="form-all">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="placeholder">
                    </div>
                    <div class="form-all">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="placeholder">
                    </div>
                    <div class="radio-check">
                        <div class="one">
                            <div class="form-all">
                                <label for="message">Message Purpose</label>
                            </div>
                        </div>
                        <div class="two">
                            <div class="form-all">
                                <input type="radio" id="inquiry" name="purpose" checked><label for="inquiry">General
                                    Inquiry</label>
                            </div>
                            <div class="form-all">
                                <input type="radio" id="reservation" name="purpose" checked><label
                                    for="reservation">Reservation Question</label>
                            </div>
                            <div class="form-all">
                                <input type="radio" id="website" name="purpose" checked><label for="website">Website
                                    Suggestion</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-all">
                        <label for="message-area">Message</label>
                    </div>
                    <textarea name="message-area" id="message-area"></textarea>
                    <div class="form-all">
                        <input type="checkbox" id="newsletter" checked name="newsletter">
                        <label for="subscribe">Please Subscribe me to monthly newsletter</label>
                    </div>
                    <button type="submit">Get in touch</button>
                </form>
            </div>

        </section>
        <section class="service">
            <div class="heading">
                <h2>We are here to serve You!</h2>
            </div>
            <figure>
                <img src="/wdd130/wwr/images/rafting17_600.jpg" alt="Adventure for you" />
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="/wdd130/wwr/images/rafting59_600.jpg" alt="Adventure for you" />
                <figcaption>Employee Profile</figcaption>
            </figure>

            <figure>
                <img src="/wdd130/wwr/images/rafting43_600.jpg" alt="Adventure for you" />
                <figcaption>Employee Profile</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 | WhiteWater Rafting Company | Ijomoni Celdric Yole</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="/wdd130/wwr/images/facebook_15713427.png" alt="Facebook Icon"></a>
            <a href="https://instagram.com"><img src="/wdd130/wwr/images/instagram_2626270.png"
                    alt="Instagram Icon"></a>
            <a href="https://twitter.com"><img src="/wdd130/wwr/images/social-media_14417460.png"
                    alt="Twitter Icon"></a>
        </nav>
    </footer>
</body>

</html>
